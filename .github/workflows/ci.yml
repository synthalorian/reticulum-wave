name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release

  build-android:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter create --platforms=android .
      - name: Set minSdk to 23
        run: |
          # Newer Flutter templates generate build.gradle.kts; older ones generate build.gradle.
          gradle_file=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then gradle_file="$f"; break; fi
          done
          if [ -z "$gradle_file" ]; then
            echo "::error::No android/app/build.gradle(.kts) found after flutter create"
            exit 1
          fi
          if ! grep -q 'flutter\.minSdkVersion' "$gradle_file"; then
            echo "::error::flutter.minSdkVersion not found in $gradle_file"
            exit 1
          fi
          sed -i 's/flutter\.minSdkVersion/23/' "$gradle_file"
          if grep -q 'flutter\.minSdkVersion' "$gradle_file"; then
            echo "::error::flutter.minSdkVersion replacement failed in $gradle_file"
            exit 1
          fi
          grep -n 'minSdk' "$gradle_file"
      - run: flutter build apk --release
