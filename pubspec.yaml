name: reticulum_wave
description: Cross-platform Reticulum/LXMF encrypted mesh messaging client
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  flutter_slidable: ^3.1.0
  cached_network_image: ^3.3.0
  flutter_markdown: ^0.7.0

  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # Serial / Hardware
  usb_serial: ^0.5.2
  flutter_blue_plus: ^1.32.0

  # Audio (voice messages)
  record: ^5.2.1
  audioplayers: ^6.0.0

  # File handling
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2
  logger: ^2.3.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.0

  # Localization
  flutter_localizations:
    sdk: flutter

  # FFI
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  ffigen: ^13.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  record_linux: ^1.0.0
